name: Threaded Horizons Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Resolve expected artifact path
        id: artifact
        run: |
          set -euo pipefail
          MC=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          VER=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          BASE=$(grep -E '^archives_base_name=' gradle.properties | cut -d= -f2 | tr -d '\r')
          # build.gradle: archivesBaseName = "${archives_base_name}-mc${minecraft_version}"
          # jar name: ${archivesBaseName}-${mod_version}.jar
          EXPECTED="${BASE}-mc${MC}-${VER}.jar"
          echo "expected=${EXPECTED}" >> "$GITHUB_OUTPUT"
          echo "expected_path=build/libs/${EXPECTED}" >> "$GITHUB_OUTPUT"
          echo "Resolved expected artifact: build/libs/${EXPECTED}"
      - name: Clean build and test
        run: |
          export JAVA_HOME=${JAVA_HOME}
          java -version
          ./gradlew --no-daemon clean test build
      - name: Artifact path check
        run: |
          set -euo pipefail
          EXPECTED_PATH="${{ steps.artifact.outputs.expected_path }}"
          EXPECTED_NAME="${{ steps.artifact.outputs.expected }}"
          test -f "$EXPECTED_PATH"
          sha256sum "$EXPECTED_PATH"
          BASENAME=$(basename "$EXPECTED_PATH")
          test "$BASENAME" = "$EXPECTED_NAME"
          # Fail if any workflow hard-codes a build/libs jar path that is not the resolved one.
          if grep -R --line-number -E 'build/libs/[^[:space:]"'\'']+\.jar' .github/workflows | grep -v -F "$EXPECTED_PATH"; then
            echo "Workflow hard-codes a jar path that does not match gradle.properties resolution" >&2
            exit 1
          fi
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: threaded-horizons-artifact
          path: ${{ steps.artifact.outputs.expected_path }}
